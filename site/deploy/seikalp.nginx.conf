server {
    listen 80;
    listen [::]:80;
    server_name seikalp.nanasinogonbei.com;

    root /var/www/seikalp;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    include /etc/nginx/snippets/seikalp-security.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Nginx 1.18 does not inherit parent headers when add_header is present.
        include /etc/nginx/snippets/seikalp-security.conf;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    error_page 404 /404.html;
}
