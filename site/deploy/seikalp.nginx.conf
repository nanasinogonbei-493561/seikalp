server {
    listen 80;
    listen [::]:80;
    server_name seikalp.nanasinogonbei.com;

    root /var/www/seikalp;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    error_page 404 /404.html;
}
